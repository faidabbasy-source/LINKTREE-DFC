<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Flashcard</title>
<meta name="theme-color" content="#111111">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400&family=Inter:wght@200&display=swap" rel="stylesheet">

<style>
  /* Frutiger Condensed bukan font gratis/web. Jika kamu punya filenya,
     taruh di folder "fonts/" dengan nama di bawah ini. Jika tidak ada,
     otomatis memakai font cadangan (Arial Narrow / sans-serif condensed). */
  @font-face {
    font-family: "Frutiger Condensed";
    src: local("Frutiger Condensed"), local("FrutigerLTStd-Condensed"),
         url("fonts/FrutigerCondensed-Regular.woff2") format("woff2"),
         url("fonts/FrutigerCondensed-Regular.ttf") format("truetype");
    font-weight: 400;
    font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    background: #111111;
    color: #eeeeee;
    font-family: "DM Sans", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  /* ===== Loading screen ===== */
  #loader {
    position: fixed;
    inset: 0;
    background: #111111;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity .4s ease, visibility .4s ease;
  }
  #loader.hide { opacity: 0; visibility: hidden; }
  .bar {
    width: min(55vw, 420px);
    height: 20px;
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 3px;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: #fff;
    border-radius: 999px;
    transition: width .25s ease;
  }

  /* ===== Card ===== */
  .card {
    width: 100%;
    max-width: 420px;
    background: #1b1b1b;
    border: 2px solid #2e2e2e;
    border-radius: 32px;
    padding: 44px 28px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo { width: 82%; max-width: 330px; height: auto; display: block; }

  .tagline {
    margin-top: 36px;
    font-family: "Frutiger Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    font-stretch: condensed;
    font-weight: 400;
    font-size: 15px;
    line-height: 1.6;
    color: #eeeeee;
  }

  .buttons {
    width: 100%;
    margin-top: 52px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 62px;
    background: #1b1b1b;
    border: 2px solid #2e2e2e;
    border-radius: 999px;
    color: #eeeeee;
    text-decoration: none;
    font-family: "DM Sans", sans-serif;
    font-weight: 400;
    font-size: 20px;
    transition: background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .btn:hover { background: #262626; border-color: #4a4a4a; }
  .btn:active { transform: scale(.98); }

  .contact { margin-top: 64px; }
  .contact h2 {
    font-family: "DM Sans", sans-serif;
    font-weight: 400;
    font-size: 16px;
    color: #eeeeee;
  }
  .contact p {
    margin-top: 4px;
    font-family: "Inter", sans-serif;
    font-weight: 200;
    font-size: 10.7px;
    line-height: 1.6;
    color: #eeeeee;
  }
  .contact a { color: inherit; text-decoration: none; }
</style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loader" aria-label="Memuat">
    <div class="bar"><div class="bar-fill" id="fill"></div></div>
  </div>

  <main class="card">
    <img class="logo" src="logo.png" alt="Digital Flashcard">

    <p class="tagline">
      Aplikasi Flashcard<br>
      IPA Bab Unsur, Senyawa, dan Campuran
    </p>

    <nav class="buttons">
      <a class="btn" href="Digital_Flashcard.apk" download="Digital_Flashcard.apk">Download Aplikasi</a>
      <a class="btn" href="https://dfc-web.my.id">Coba Website Aplikasi</a>
      <a class="btn" href="https://dfc-info.my.id">Informasi Lainnya</a>
    </nav>

    <section class="contact">
      <h2>Contact Us</h2>
      <p>
        Achmad Faid Abbasy / <a href="mailto:faidabbasy@gmail.com">faidabbasy@gmail.com</a><br>
        Razqa Abiyyu Khiyar / <a href="https://instagram.com/smpit_arj" target="_blank" rel="noopener">smpit_arj on instagram</a>
      </p>
    </section>
  </main>

<script>
  // Loading bar: naik perlahan, selesai saat semua aset (logo, font) termuat
  (function () {
    var fill = document.getElementById('fill');
    var loader = document.getElementById('loader');
    var progress = 0, done = false;

    var timer = setInterval(function () {
      if (!done && progress < 85) {
        progress += Math.random() * 8;
        fill.style.width = Math.min(progress, 85) + '%';
      }
    }, 120);

    window.addEventListener('load', function () {
      done = true;
      clearInterval(timer);
      fill.style.width = '100%';
      setTimeout(function () { loader.classList.add('hide'); }, 450);
    });
  })();
</script>
</body>
</html>
